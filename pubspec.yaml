name: sportify
description: "Sportify — The world's first LinkedIn-style professional platform for football and sports."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Icons
  cupertino_icons: ^1.0.8

  # ── State Management ──
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # ── Networking ──
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4

  # ── Dependency Injection ──
  get_it: ^8.0.3

  # ── Code Generation (annotations only — runtime) ──
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # ── Navigation ──
  go_router: ^15.1.2

  # ── Storage ──
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # ── UI Utilities ──
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation (build-time only) ──
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.5

  # ── Testing ──
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # ── Linting ──
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  # Assets will be added as we build features
  # assets:
  #   - assets/images/
  #   - assets/icons/
